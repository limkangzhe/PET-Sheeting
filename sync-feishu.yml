name: Build Dashboard Data From File

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: "Optional source file, for example data/May 2026.xlsx"
        required: false
        default: ""
      month:
        description: "Dashboard month, for example 2026-05"
        required: true
        default: "2026-05"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build dashboard data
        env:
          DASHBOARD_SOURCE_FILE: ${{ github.event.inputs.source_file }}
          DASHBOARD_MONTH: ${{ github.event.inputs.month }}
        run: node scripts/build-dashboard-data.mjs

      - name: Commit dashboard data
        run: |
          if [ -z "$(git status --porcelain dashboard-data.json)" ]; then
            echo "No dashboard data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard-data.json
            git commit -m "Build dashboard data from uploaded file"
            git push
          fi
