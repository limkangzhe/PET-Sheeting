name: Sync Feishu Dashboard Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Feishu sheet
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_SPREADSHEET_TOKEN: JkdYsFb6KhX1MXtwSlAcYbMOnfd
          FEISHU_TOTAL_SHEET_ID: 31FeWT
          DASHBOARD_MONTH: "2026-05"
        run: node scripts/sync-feishu.mjs

      - name: Commit dashboard data
        run: |
          if [ -z "$(git status --porcelain dashboard-data.json)" ]; then
            echo "No dashboard data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard-data.json
            git commit -m "Sync Feishu dashboard data"
            git push
          fi
